<div class="student-card">
  <h3>{{ student().name }}</h3>
  <p>{{ student().email }}</p>
  <p>Age: {{ student().age }}</p>
  <p>Department ID: {{ student().department_id }}</p>
</div>

<button (click)="studentDeleted.emit(student().id)">
  Delete
</button>

<a [routerLink]="['/students', student().id]">
  View Details
</a>
