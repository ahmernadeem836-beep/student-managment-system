<h1>{{ title() }}</h1>
<img [src]="imageUrl()" alt="Test Image">

<h2>Add Student</h2>

<form (submit)="addStudent($event)">
  <input
  type="text"
  placeholder="Student Name"
  [value]="studentName()"
  (input)="studentName.set($any($event.target).value)"
>

<input
  type="text"
  placeholder="Course"
  [value]="studentCourse()"
  (input)="studentCourse.set($any($event.target).value)"
>

  <button type="submit">Add Student</button>
</form>
<h2>Students</h2>

@for (student of students; track student.name) {
  <app-student-card
    [student]="student"
    (studentDeleted)="onStudentDeleted($event)"
  ></app-student-card>
}
